<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  
  <!-- Four iconic colorful dots from the FAKE OU FATO logo -->
  <!-- Red (Fake) -->
  <circle cx="21" cy="23" r="8.5" fill="#ea4335"/>
  <!-- Green (Fato) -->
  <circle cx="43" cy="23" r="8.5" fill="#34a853"/>
  <!-- Blue (Investigation/Tech) -->
  <circle cx="21" cy="41" r="8.5" fill="#4285f4"/>
  <!-- Yellow (Caution/Alert) -->
  <circle cx="43" cy="41" r="8.5" fill="#fbbc05"/>

  <!-- Center subtle checkmark / magnifying glass accent -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" opacity="0.95"/>
</svg>
